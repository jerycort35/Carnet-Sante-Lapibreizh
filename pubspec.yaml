name: lapibreizh_app
description: "Carnet de santé digital pour lapins - Les Lapibreizh"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  share_plus: ^8.0.0
  pdf: ^3.10.8
  printing: ^5.12.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
